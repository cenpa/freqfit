# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  apt_packages:
    - pandoc
  jobs:
    pre_build:
      # Auto-generate API reference from source
      - rm -rf docs/source/api
      - >-
        sphinx-apidoc
        --private
        --module-first
        --force
        --output-dir docs/source/api
        src/freqfit
        src/freqfit/_version.py

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - epub
  - pdf

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
